
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AttendTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
    <header class="dashboard-navbar">
        <a href="dashboard.html" class="logo">AttendTrack</a>
        <nav class="dashboard-nav">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="attendance.html">Attendance</a>
            <a href="students.html">Students</a>
            <a href="records.html">Records</a>
            <a href="reports.html">Reports</a>
        </nav>
        <a href="index.html" class="dashboard-logout">Logout</a>
    </header>

    <main class="dashboard-container">
        <section class="dashboard-welcome">
            <div>
                <p class="dashboard-label">OVERVIEW</p>
                <h1>Dashboard</h1>
                <p>View student attendance statistics and summaries.</p>
            </div>
        </section>

        <section class="dashboard-stats">
            <article class="dashboard-stat-card">
                <p>Total Students</p>
                <h2 id="totalStudents">—</h2>
            </article>
            <article class="dashboard-stat-card">
                <p>Present Today</p>
                <h2 id="presentToday">—</h2>
            </article>
            <article class="dashboard-stat-card">
                <p>Absent Today</p>
                <h2 id="absentToday">—</h2>
            </article>
            <article class="dashboard-stat-card">
                <p>Late Today</p>
                <h2 id="lateToday">—</h2>
            </article>
        </section>

        <section class="dashboard-panel">
            <h2>Attendance Overview</h2>
            <p id="attendanceRate">No attendance data available.</p>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
