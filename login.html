<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Attendance Monitoring System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-brand">
            <a href="index.html" class="back-home">← Back to Home</a>

            <div class="brand-content">
                <h1>AttendTrack</h1>

                <h2>Student Attendance<br>Monitoring System</h2>

                <p>
                    Monitor attendance, manage student records,
                    and keep track of attendance efficiently.
                </p>
            </div>
        </div>

        <div class="login-section">

            <div class="login-box">

                <div class="login-header">
                    <h2>Welcome Back!</h2>
                    <p>Please enter your account details to continue.</p>
                </div>

                <form id="loginForm">

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            Remember me
                        </label>

                        <a href="#" class="forgot-password">
                            Forgot Password?
                        </a>
                    </div>

                   
<button type="submit" class="login-btn">
    <span>Log In</span>
    <span class="login-arrow" aria-hidden="true">→</span>
</button>

                </form>

            </div>

        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
