
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Register | AttendTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="auth-container">

        <!-- LEFT SIDE: LOGIN -->
        <section class="auth-panel login-panel">

            <div class="auth-welcome">
                <h1>Hello, Bravehearts!</h1>

                <p>
                    If you already have an account,
                    login here!
                </p>
            </div>

            <div class="auth-form login-form-container">

                <h2>Login</h2>
                <p class="auth-subtitle">
                    Welcome back! Sign in to continue.
                </p>

                <form id="loginForm">

                    <div class="input-group">
                        <label for="loginEmail">Email</label>
                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="login-btn">
                        <span>Log In</span>
                        <span class="login-arrow" aria-hidden="true">→</span>
                    </button>

                    <p
                        id="loginMessage"
                        role="status"
                        aria-live="polite">
                    </p>

                </form>

            </div>

        </section>


        <!-- RIGHT SIDE: REGISTER -->
        <section class="auth-panel register-panel">

            <div class="register-form-container">

                <h2>Register Here</h2>

                <p class="auth-subtitle">
                    Create your account to get started.
                </p>

                <form id="registerForm">

                    <div class="input-group">
                        <label for="registerUsername">Username</label>
                        <input
                            type="text"
                            id="registerUsername"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="registerEmail">Email</label>
                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="registerPassword">Password</label>
                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button type="submit" class="register-btn">
                        Register
                    </button>

                    <p
                        id="registerMessage"
                        role="status"
                        aria-live="polite">
                    </p>

                </form>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

    <script>
        // Registration UI only.
        // Connect this form to the registration API before using it.
        document.getElementById("registerForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                const message =
                    document.getElementById("registerMessage");

                message.textContent =
                    "Registration is not connected to the API yet.";
            });
    </script>

</body>
</html>
