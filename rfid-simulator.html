<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RFID Simulator | AttendTrack</title><link rel="stylesheet" href="management.css"><link rel="stylesheet" href="layout.css">
</head><body><main class="wrap"><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="programs.html">Programs</a><a href="academic-years.html">Academic Years</a><a href="enrollments.html">Enrollments</a><a href="sessions.html">Sessions</a></nav><h1>RFID Registration & Simulator</h1><p><strong>Simulation mode:</strong> no physical reader is needed yet. Register a test UID, then enter that same UID to simulate a card tap.</p><h2>1. Register a test card</h2><form id="registerForm"><div class="grid"><div><label>Student</label><select id="studentId" required></select></div><div><label>Test Card UID</label><input id="cardUid" placeholder="e.g. A1B2C3D4" required></div></div><button>Register Card</button></form><hr><h2>2. Simulate an attendance scan</h2><form id="scanForm"><div class="grid"><div><label>Open Attendance Session</label><select id="sessionId" required></select></div><div><label>Card UID</label><input id="scanUid" placeholder="Enter the registered UID" required></div></div><button>Simulate RFID Tap</button></form><p id="message" role="status"></p><h2>Registered Cards</h2><table><thead><tr><th>Student</th><th>UID</th><th>Status</th></tr></thead><tbody id="cardsBody"></tbody></table></main><script src="api.js"></script><script src="rfid-simulator.js"></script><script src="layout.js"></script>
</body></html>
