<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Sessions | AttendTrack</title><link rel="stylesheet" href="management.css"><link rel="stylesheet" href="layout.css">
</head><body data-page="sessions"><main class="wrap"><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="programs.html">Programs</a><a href="academic-years.html">Academic Years</a><a href="enrollments.html">Enrollments</a><a href="rfid-simulator.html">RFID Simulator</a></nav><h1>Attendance Sessions</h1><p>Create sessions for classes or school events. The system determines Present or Late using the start time and grace period.</p><form id="dataForm"><div class="grid"><div><label>Session Name</label><input name="name" placeholder="e.g. ITECC05 - Morning Class" required></div><div><label>Session Type</label><select name="sessionType"><option>Class</option><option>Event</option></select></div><div><label>Start Date and Time (Philippine time)</label><input name="startsAt" type="datetime-local" required></div><div><label>End Date and Time (optional)</label><input name="endsAt" type="datetime-local"></div><div><label>Grace Period (minutes)</label><input name="gracePeriodMinutes" type="number" min="0" max="120" value="10" required></div><div><label>Academic Year (required for Class)</label><select name="academicYearId" id="academicYearId"><option value="">Select academic year</option></select></div><div><label>Program (required for Class)</label><select name="programId" id="programId"><option value="">Select program</option></select></div><div><label>Section (required for Class)</label><input name="section" placeholder="e.g. 2A"></div></div><button type="submit">Create Session</button></form><p id="message" role="status"></p><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></main><script src="api.js"></script><script src="management.js"></script><script src="layout.js"></script>
</body></html>
