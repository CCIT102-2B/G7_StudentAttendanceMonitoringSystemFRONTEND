
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Records | AttendTrack</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <header class="dashboard-navbar">

        <a href="dashboard.html" class="logo">AttendTrack</a>

        <nav class="dashboard-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="attendance.html">Attendance</a>
            <a href="students.html">Students</a>
            <a href="records.html" class="active">Records</a>
            <a href="reports.html">Reports</a>
        </nav>

        <a href="index.html" class="dashboard-logout">Logout</a>

    </header>


    <!-- MAIN CONTENT -->
    <main class="page-container">

        <!-- PAGE HEADING -->
        <div class="page-heading">
            <div>
                <h1>Attendance Records</h1>
                <p>Search and review historical attendance.</p>
            </div>
        </div>


        <!-- FILTER PANEL -->
        <section class="filter-panel">

            <label for="recordDateFilter">Date</label>

            <input
                type="date"
                id="recordDateFilter">

            <input
                type="search"
                id="recordSearch"
                placeholder="Search by student ID or name..."
                aria-label="Search records">

        </section>


        <!-- RECORDS TABLE -->
        <section class="table-panel">

            <div class="table-wrapper">

                <table class="data-table">

                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th>Program</th>
                            <th>Time In</th>
                            <th>Time Out</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="recordsTableBody">

                        <tr>
                            <td colspan="7" class="empty-state">
                                Loading attendance records...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

            <!-- RECORDS MESSAGE -->
            <p
                id="recordsMessage"
                role="status"
                aria-live="polite">
            </p>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="app.js"></script>

</body>
</html>
